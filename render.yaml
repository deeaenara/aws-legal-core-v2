services:
  - type: web
    name: aws-legal-backend
    env: docker
    repo: https://github.com/YOUR_USERNAME/aws-legal-core-v2
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: supersecret
      - key: DB_URL
        fromDatabase:
          name: aws-legal-db
          property: connectionString
      - key: EMAIL_USER
        value: your@email.com
      - key: EMAIL_PASS
        value: password
      - key: ONESIGNAL_KEY
        value: dummy
      - key: CALLMEBOT_KEY
        value: dummy

  - type: web
    name: aws-legal-frontend
    env: docker
    repo: https://github.com/YOUR_USERNAME/aws-legal-core-v2
    dockerfilePath: client/Dockerfile

  - type: cron
    name: daily-pl-report
    env: docker
    repo: https://github.com/YOUR_USERNAME/aws-legal-core-v2
    dockerfilePath: backend/Dockerfile
    schedule: "0 23 * * *"
    envVars:
      - key: DB_URL
        fromDatabase:
          name: aws-legal-db
          property: connectionString
      - key: EMAIL_USER
        value: your@email.com
      - key: EMAIL_PASS
        value: password

databases:
  - name: aws-legal-db
    databaseName: awslegal
    user: postgres
